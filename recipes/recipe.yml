---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bulwark-os
description: Qubes OS-inspired immutable Linux distro with libvirt compartmentalization.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 43
  # -------------------------------------------------------------------------
  #    System files: drops wizard, VM templates, base images, systemd units
  #    into the OS image verbatim from files/system/
  # -------------------------------------------------------------------------
modules:
  - type: files
    files:
      - source: system
        destination: /
  # -------------------------------------------------------------------------
  #    DNF packages & default Flatpaks
  # -------------------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        - hikariknight/looking-glass-kvmfr
    install:
      packages:
        - libvirt
        - virt-manager
        - virt-viewer
        - qemu-kvm
        - dnsmasq
        - qemu-img
        - bridge-utils
        - python3-gobject
        - python3-libvirt
        - pciutils
        - mokutil
        - curl
    remove:
      packages:
        - gnome-tour
        - gnome-initial-setup
        - gnome-shell-extension-background-logo
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.gnome.Loupe
      - scope: user
  # -------------------------------------------------------------------------
  #    Containerfile Snippets
  # -------------------------------------------------------------------------
  - type: containerfile
    snippets:
  # ── Looking Glass Module ──────────────────────────────────────────────
      - |
        RUN \
	  COPY --from=ghcr.io/ublue-os/akmods:${KERNEL_FLAVOR}-${FEDORA_MAJOR_VERSION} /rpms /tmp/akmods-rpms
	  COPY --from=ghcr.io/ublue-os/akmods-extra:${KERNEL_FLAVOR}-${FEDORA_MAJOR_VERSION} /rpms /tmp/akmods-rpms
	  RUN sed -i 's@enabled=0@enabled=1@g' /etc/yum.repos.d/_copr_ublue-os-akmods.repo && \
	    wget https://copr.fedorainfracloud.org/coprs/hikariknight/looking-glass-kvmfr/repo/fedora-"${FEDORA_MAJOR_VERSION}"/hikariknight-looking-glass-kvmfr-fedora-"${FEDORA_MAJOR_VERSION}".repo -O /etc/yum.repos.d/hikariknight-looking-glass-kvmfr-fedora-"${FEDORA_MAJOR_VERSION}".repo && \
	    rpm-ostree install \
		/tmp/akmods-rpms/kmods/*kvmfr*.rpm && \
	    ostree container commit    
  # ── Fetch base VM disk images ─────────────────────────────────────
      - |
        RUN BASE_DIR="/usr/share/bulwarkos/base-images" && \
            mkdir -p "$BASE_DIR" && \
            curl -L -f --retry 3 --retry-delay 5 \
              -o "$BASE_DIR/rocky-base.qcow2" \
              "https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2" && \
            curl -L -f --retry 3 --retry-delay 5 \
              -o "$BASE_DIR/fedora-gnome-base.qcow2" \
              "https://github.com/connorethanjay/bulwarkOS/releases/download/v0.1.0/fedora-gnome-base.qcow2" && \
            sha256sum "$BASE_DIR"/*.qcow2 > "$BASE_DIR/SHA256SUMS" && \
            ls -lh "$BASE_DIR"
  # -------------------------------------------------------------------------
  #    Tweaks & Extensions
  # -------------------------------------------------------------------------
  - type: gnome-extensions
    install:
    - Dash to Dock
    - Vitals
    - Click to close overview

  - type: gschema-overrides
    include:
      - zz1-bulwarkos.gschema.override
  # -------------------------------------------------------------------------
  #    Systemd units
  # -------------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - libvirtd.service
        - bulwarkos-disposable-reset.service
    user:
      enabled:
        - bulwarkos-setup.service
  # -------------------------------------------------------------------------
  #    OS identity
  # -------------------------------------------------------------------------
  - type: os-release
    properties:
      ID: bulwarkOS
      ID_LIKE: fedora
      NAME: bulwarkOS
      PRETTY_NAME: bulwarkOS
      DEFAULT_HOSTNAME: bulwarkos
      ANSI_COLOR: "0;38;2;84;106;193"
      HOME_URL: "https://github.com/connorethanjay/bulwarkOS"
      DOCUMENTATION_URL: "https://github.com/connorethanjay/bulwarkOS"
      SUPPORT_URL: "https://github.com/connorethanjay/bulwarkOS"
      BUG_REPORT_URL: "https://github.com/connorethanjay/bulwarkOS/issues"
  # -------------------------------------------------------------------------
  #    Image signing — always last
  # -------------------------------------------------------------------------
  - type: signing
