---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bulwark-os
description: Qubes OS-inspired immutable Linux distro with libvirt compartmentalization.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 43
  # -------------------------------------------------------------------------
  #    System files: drops wizard, VM templates, base images, systemd units
  #    into the OS image verbatim from files/system/
  # -------------------------------------------------------------------------
modules:
  - type: files
    files:
      - source: system
        destination: /
  # -------------------------------------------------------------------------
  #    DNF packages & default Flatpaks
  # -------------------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - libvirt
        - virt-manager
        - qemu-kvm
        - dnsmasq
        - qemu-img
        - bridge-utils
        - python3-gobject
        - python3-libvirt
        - pciutils
        - mokutil
        - genisoimage
        - curl
    remove:
      packages:
        - gnome-tour
        - gnome-initial-setup
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.gnome.Loupe
      - scope: user
  # -------------------------------------------------------------------------
  #    Base VM Disk Images
  # -------------------------------------------------------------------------
  - type: containerfile
    snippets:
      - |
        RUN BASE_DIR="/usr/share/bulwarkos/base-images" && \
            RELEASE_URL="https://github.com/connorethanjay/bulwarkos/releases/download/base-images-v1" && \
            mkdir -p "$BASE_DIR" && \
            curl -L -f --retry 3 --retry-delay 5 \
              -o "$BASE_DIR/alpine-nocloud.qcow2" \
              "$RELEASE_URL/alpine-nocloud.qcow2" && \
            curl -L -f --retry 3 --retry-delay 5 \
              -o "$BASE_DIR/fedora-cloud-base.qcow2" \
              "$RELEASE_URL/fedora-cloud-base.qcow2" && \
            sha256sum "$BASE_DIR"/*.qcow2 > "$BASE_DIR/SHA256SUMS" && \
            ls -lh "$BASE_DIR"
  # -------------------------------------------------------------------------
  #    Tweaks & Extensions
  # -------------------------------------------------------------------------
  - type: gnome-extensions
    install:
    - 307
    - Vitals
    - Click to close overview
    - Date Menu Formatter

  - type: gschema-overrides
    include:
      - zz1-bulwarkos.gschema.override
  # -------------------------------------------------------------------------
  #    Systemd units
  # -------------------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - libvirtd.service
        - bulwarkos-disposable-reset.service
    user:
      enabled:
        - bulwarkos-setup.service
  # -------------------------------------------------------------------------
  #    OS identity
  # -------------------------------------------------------------------------
  - type: os-release
    properties:
      ID: bulwarkOS
      ID_LIKE: fedora
      NAME: bulwarkOS
      PRETTY_NAME: bulwarkOS
      BUG_REPORT_URL: "https://github.com/connorethanjay/bulwarkOS/issues"
  # -------------------------------------------------------------------------
  #    Image signing — always last
  # -------------------------------------------------------------------------
  - type: signing
